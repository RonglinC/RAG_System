services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.cache:/app/.cache
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./.cache:/app/.cache
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
